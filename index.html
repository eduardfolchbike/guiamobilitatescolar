<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guia de Mobilitat Escolar</title>
<meta name="description" content="Eina digital guiada per impulsar projectes de mobilitat escolar sostenible. Accés per sol·licitud.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{--red:#DA1B2E;--red-ink:#B3121F;--ink:#2E2829;--ink2:#5E5556;--line:#ECE5E5;--card:#F9F7F7;--ok:#1F7A4D;--f:"Montserrat","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--f);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.hero{background:var(--red);color:#fff;padding:56px 56px 40px;display:flex;flex-direction:column}
.hero .tag{font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.hero h1{font-weight:800;font-size:clamp(2rem,4.2vw,3.4rem);line-height:1.08;letter-spacing:-.02em;margin:auto 0 18px}
.hero p{font-size:1.1rem;max-width:34em;opacity:.95}
.hero ul{list-style:none;margin:26px 0 0;display:grid;gap:10px;font-weight:600}
.hero li::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff;margin-right:12px;vertical-align:middle}
.hero .by{margin-top:auto;padding-top:36px;font-weight:600;font-size:.9rem;opacity:.85}
.panel{padding:56px;display:flex;flex-direction:column;justify-content:center;gap:34px;max-width:560px;width:100%;margin:0 auto}
.lang{position:absolute;top:18px;right:20px;font-weight:700;font-size:.85rem;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:#fff}
.lang:hover{border-color:var(--red);color:var(--red)}
h2{font-weight:800;font-size:1.35rem;margin-bottom:6px}
.sub{color:var(--ink2);font-size:.95rem;margin-bottom:16px}
label{display:block;font-weight:600;font-size:.85rem;margin:12px 0 5px}
input[type=text],input[type=email]{width:100%;font:500 1rem var(--f);padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px #FBE3E6}
button{margin-top:16px;width:100%;font:700 1rem var(--f);padding:14px 18px;border:0;border-radius:10px;background:var(--red);color:#fff;cursor:pointer}
button:hover{background:var(--red-ink)}button[disabled]{opacity:.6;cursor:wait}
button.ghost{background:var(--ink)}button.ghost:hover{background:#000}
.msg{margin-top:12px;font-size:.92rem;font-weight:600;min-height:1.3em}
.msg.ok{color:var(--ok)}.msg.err{color:var(--red-ink)}
.sep{height:1px;background:var(--line)}
.hp{position:absolute;left:-9999px;opacity:0}
.fine{font-size:.78rem;color:var(--ink2)}
#boot{display:none;min-height:100vh;align-items:center;justify-content:center;font-weight:700;color:var(--ink2)}
body.booting .wrap{display:none}body.booting #boot{display:flex}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.hero{padding:70px 24px 32px}.hero h1{margin:36px 0 16px}.panel{padding:32px 24px 48px}}
</style>
</head>
<body class="booting">
<div id="boot">…</div>
<a class="lang" id="langlink" href="#"></a>
<div class="wrap">
  <section class="hero">
    <span class="tag" data-t="tag"></span>
    <h1 data-t="h1"></h1>
    <p data-t="lead"></p>
    <ul id="bul"></ul>
    <div class="by">Eduard Folch</div>
  </section>
  <section class="panel">
    <div>
      <h2 data-t="reqH"></h2>
      <p class="sub" data-t="reqP"></p>
      <form id="req" novalidate>
        <label for="em" data-t="email"></label>
        <input id="em" type="email" autocomplete="email" required>
        <label for="org" data-t="org"></label>
        <input id="org" type="text" autocomplete="organization">
        <input class="hp" id="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit" id="reqBtn" data-t="reqBtn"></button>
        <div class="msg" id="reqMsg" role="status"></div>
      </form>
    </div>
    <div class="sep"></div>
    <div>
      <h2 data-t="codeH"></h2>
      <p class="sub" data-t="codeP"></p>
      <form id="cod" novalidate>
        <label for="cd" data-t="code"></label>
        <input id="cd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="submit" id="codBtn" class="ghost" data-t="codeBtn"></button>
        <div class="msg" id="codMsg" role="status"></div>
      </form>
    </div>
    <p class="fine" data-t="fine"></p>
  </section>
</div>
<script>
(function(){
var LANG="ca",ROOT="app/",ITER=250000,OWNER="eduard.folch@gmail.com";
var T={
ca:{tag:"Eina digital · Accés per sol·licitud",h1:"Guia de Mobilitat Escolar",lead:"Una eina guiada, pas a pas, per impulsar projectes de mobilitat escolar sostenible.",
 bul:["Comissió, diagnosi i enquesta a les famílies","Fitxes de solucions: camí escolar, bicibús, pedibús…","Informe imprimible per compartir i presentar"],
 reqH:"Sol·licita l'accés",reqP:"Deixa'ns el teu correu i, un cop aprovada la sol·licitud, rebràs el codi d'accés.",email:"Correu electrònic",org:"Ajuntament, escola o entitat (opcional)",reqBtn:"Demana l'accés",
 reqOk:"Sol·licitud enviada. Rebràs el codi per correu quan s'aprovi.",reqErr:"No s'ha pogut enviar.",mailLink:"Envia la sol·licitud per correu",mailSub:"Sol·licitud d'accés · Guia de Mobilitat Escolar",mailBody:"Hola, sol·licito accés a la guia.\n\nCorreu: ",reqBad:"Escriu un correu vàlid.",
 codeH:"Ja tinc el codi",codeP:"Introdueix el codi que has rebut per entrar a l'eina.",code:"Codi d'accés",codeBtn:"Entra a l'eina",codeBad:"Codi incorrecte.",codeWait:"Comprovant…",
 fine:"Les teves dades només s'utilitzen per gestionar la sol·licitud d'accés.",other:"Castellano",otherHref:"es/"},
es:{tag:"Herramienta digital · Acceso por solicitud",h1:"Guía de Movilidad Escolar",lead:"Una herramienta guiada, paso a paso, para impulsar proyectos de movilidad escolar sostenible.",
 bul:["Comisión, diagnóstico y encuesta a las familias","Fichas de soluciones: camino escolar, bicibús, pedibús…","Informe imprimible para compartir y presentar"],
 reqH:"Solicita el acceso",reqP:"Déjanos tu correo y, una vez aprobada la solicitud, recibirás el código de acceso.",email:"Correo electrónico",org:"Ayuntamiento, escuela o entidad (opcional)",reqBtn:"Pedir acceso",
 reqOk:"Solicitud enviada. Recibirás el código por correo cuando se apruebe.",reqErr:"No se ha podido enviar.",mailLink:"Envía la solicitud por correo",mailSub:"Solicitud de acceso · Guía de Movilidad Escolar",mailBody:"Hola, solicito acceso a la guía.\n\nCorreo: ",reqBad:"Escribe un correo válido.",
 codeH:"Ya tengo el código",codeP:"Introduce el código que has recibido para entrar en la herramienta.",code:"Código de acceso",codeBtn:"Entrar en la herramienta",codeBad:"Código incorrecto.",codeWait:"Comprobando…",
 fine:"Tus datos solo se utilizan para gestionar la solicitud de acceso.",other:"Català",otherHref:"../"}
}[LANG];
document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=T[e.getAttribute("data-t")]});
document.getElementById("bul").innerHTML=T.bul.map(function(b){return "<li>"+b+"</li>"}).join("");
var ll=document.getElementById("langlink");ll.textContent=T.other;ll.href=T.otherHref;
var KEY="gme_code";
function norm(c){return String(c||"").trim().toLowerCase()}
async function unlock(code){
  var buf=new Uint8Array(await (await fetch(ROOT+LANG+".bin",{cache:"no-cache"})).arrayBuffer());
  var salt=buf.slice(0,16),iv=buf.slice(16,28),ct=buf.slice(28);
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  var html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return html;
}
function enter(html){document.open();document.write(html);document.close()}
var saved;try{saved=localStorage.getItem(KEY)}catch(e){}
if(saved){unlock(saved).then(enter).catch(function(){try{localStorage.removeItem(KEY)}catch(e){}document.body.classList.remove("booting")})}
else document.body.classList.remove("booting");
document.getElementById("cod").addEventListener("submit",async function(ev){
  ev.preventDefault();var m=document.getElementById("codMsg"),b=document.getElementById("codBtn"),c=norm(document.getElementById("cd").value);
  if(!c){m.className="msg err";m.textContent=T.codeBad;return}
  b.disabled=true;m.className="msg";m.textContent=T.codeWait;
  try{var html=await unlock(c);try{localStorage.setItem(KEY,c)}catch(e){}enter(html)}
  catch(e){b.disabled=false;m.className="msg err";m.textContent=T.codeBad}
});
document.getElementById("req").addEventListener("submit",async function(ev){
  ev.preventDefault();var m=document.getElementById("reqMsg"),b=document.getElementById("reqBtn"),em=document.getElementById("em").value.trim();
  if(document.getElementById("hp").value)return;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){m.className="msg err";m.textContent=T.reqBad;return}
  b.disabled=true;m.className="msg";m.textContent="…";
  try{
    var r=await fetch("https://formsubmit.co/ajax/"+OWNER,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
      body:JSON.stringify({email:em,organitzacio:document.getElementById("org").value.trim(),idioma:LANG,_subject:"Sol·licitud d'accés · Guia de Mobilitat Escolar",_template:"table",_captcha:"false"})});
    var j=await r.json();if(!r.ok||String(j.success)==="false"){try{console.warn("formsubmit:",j.message)}catch(_){}throw 0}
    m.className="msg ok";m.textContent=T.reqOk;document.getElementById("req").reset();
  }catch(e){
    var sub=encodeURIComponent(T.mailSub),body=encodeURIComponent(T.mailBody+em+(document.getElementById("org").value?"\n"+document.getElementById("org").value:""));
    m.className="msg err";m.innerHTML="";m.appendChild(document.createTextNode(T.reqErr+" "));
    var a=document.createElement("a");a.href="mailto:"+OWNER+"?subject="+sub+"&body="+body;a.textContent=T.mailLink;a.style.color="inherit";m.appendChild(a);
  }
  b.disabled=false;
});
})();
</script>
</body>
</html>
